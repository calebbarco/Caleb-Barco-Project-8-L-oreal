<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L’Oréal Smart Product Advisor</title>
    <meta
      name="description"
      content="L’Oréal Smart Product Advisor — personalized beauty guidance across skincare, haircare, makeup, and fragrance."
    />
    <meta property="og:title" content="L’Oréal Smart Product Advisor" />
    <meta
      property="og:description"
      content="Discover L’Oréal products and personalized beauty routines across skincare, haircare, makeup, and fragrance."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!-- Typography inspired by Monotype's L'Oréal Brand Review: high-contrast Bodoni display + clean neo-grotesque UI sans -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Top L'Oréal brand accent bar (Black & Vibrant Red from FutureBrand identity) -->
    <div class="brand-accent-bar" aria-hidden="true"></div>

    <div class="page-wrapper">
      <!-- Header / Branding -->
      <header class="site-header">
        <div class="brand-lockup">
          <img
            src="./img/loreal-logo.png"
            alt="L’Oréal"
            class="brand-logo"
          />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-department">Beauty Tech Studio</span>
        </div>
        <h1 class="site-title">Smart Product Advisor</h1>
        <p class="site-subtitle">
          Personalized consultations across skincare, haircare, makeup, and signature fragrance.
        </p>
      </header>

      <!-- Chat Area -->
      <main>
        <section class="chatbox" aria-label="L’Oréal Beauty Consultation">
          <div class="chatbox-header">
            <div class="chatbox-heading-group">
              <span class="chatbox-kicker">Private Consultation</span>
              <span class="chatbox-meta" aria-hidden="true">·</span>
              <span id="sessionContextLabel" class="chatbox-meta">Tailored Routine Guidance</span>
            </div>
            <button
              type="button"
              id="resetBtn"
              class="reset-btn"
              aria-label="Start a new consultation"
            >
              <span class="material-icons" aria-hidden="true">refresh</span>
              <span>New Chat</span>
            </button>
          </div>

          <div
            id="chatWindow"
            class="chat-window"
            role="log"
            aria-live="polite"
            aria-label="Conversation history"
          >
            <!-- messages will be appended here via JS -->
          </div>

          <!-- Quick topic prompts for one-click routine exploration -->
          <div class="quick-prompts" role="group" aria-label="Suggested topics">
            <!-- populated via JS from QUICK_PROMPTS -->
          </div>

          <form id="chatForm" class="chat-form" novalidate>
            <label for="userInput" class="visually-hidden">
              Ask about L’Oréal products or routines
            </label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L’Oréal products, skin types, or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send message">
              <span class="material-icons" aria-hidden="true">arrow_forward</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!-- Footer Links -->
      <footer class="site-footer">
        <p>&copy; 2026 L’Oréal. Smart Product Advisor.</p>
        <nav aria-label="Footer navigation">
          <button type="button" class="footer-link-btn" data-info="privacy">
            Privacy Policy
          </button>
          <button type="button" class="footer-link-btn" data-info="terms">
            Terms of Use
          </button>
          <button type="button" class="footer-link-btn" data-info="contact">
            Contact
          </button>
        </nav>
      </footer>
    </div>

    <!-- Accessible informational dialog for footer links -->
    <dialog id="infoDialog" class="info-dialog" aria-labelledby="infoDialogTitle">
      <div class="info-dialog-inner">
        <div class="info-dialog-header">
          <h2 id="infoDialogTitle" class="info-dialog-title">Information</h2>
          <button
            type="button"
            id="closeDialogBtn"
            class="dialog-close-btn"
            aria-label="Close dialog"
          >
            <span class="material-icons" aria-hidden="true">close</span>
          </button>
        </div>
        <p id="infoDialogBody" class="info-dialog-body"></p>
      </div>
    </dialog>

    <script type="module" src="./advisor.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
